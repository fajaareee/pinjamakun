services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: pinjamakun
      POSTGRES_USER: pinjamakun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pinjamakun -d pinjamakun']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - '127.0.0.1:5432:5432'
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  postgres_data:
