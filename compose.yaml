services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pinjamakun
      POSTGRES_USER: pinjamakun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pinjamakun -d pinjamakun']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'

volumes:
  postgres_data:
